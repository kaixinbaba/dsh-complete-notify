<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f6"/>
      <stop offset="1" stop-color="#dfe5ee"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="700" fill="url(#bg)"/>

  <!-- macOS 风格系统通知横幅 -->
  <g transform="translate(120, 170)">
    <rect width="760" height="190" rx="22" fill="#f7f8fa" stroke="#d5dae3" stroke-width="2"/>
    <!-- 应用图标 -->
    <rect x="34" y="34" width="52" height="52" rx="14" fill="#181b22"/>
    <circle cx="60" cy="60" r="14" fill="#4ade80"/>
    <path d="M54 60 l5 5 l10 -10" stroke="#181b22" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 标题行 -->
    <text x="104" y="60" font-family="PingFang SC, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#3a4354">DeepSeek Harness</text>
    <text x="660" y="60" font-family="PingFang SC, Helvetica, sans-serif" font-size="18" fill="#8a94a6">现在</text>
    <!-- 正文 -->
    <text x="104" y="112" font-family="PingFang SC, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#1c2230">任务完成</text>
    <text x="104" y="154" font-family="PingFang SC, Helvetica, sans-serif" font-size="22" fill="#5b6b80">修复登录 · session 3f9a…</text>
  </g>

  <g font-family="PingFang SC, Helvetica, sans-serif" text-anchor="middle">
    <text x="500" y="470" font-size="32" font-weight="600" fill="#1c2230">页面在后台时 → 系统通知</text>
    <text x="500" y="516" font-size="22" fill="#5b6b80">点击通知：聚焦窗口并打开对应会话 · 标签页标题同步闪烁</text>
  </g>
</svg>
